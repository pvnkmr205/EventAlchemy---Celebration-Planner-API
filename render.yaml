services:
  - type: web
    name: celebration-planner-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # paste in Render dashboard — never in the repo
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash-lite
      - key: FORCE_FALLBACK
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.5"